      - name: Permission surface logic on Windows PowerShell 5.1
        # Same suite, same reason as the other 5.1 steps: Set-PrivateAcl opens with
        # `$ErrorActionPreference = "Continue"` and that line only matters on the host
        # Task Scheduler actually registers (5.1 turns native stderr into a terminating
        # exception; pwsh 7 does not). If it is dropped, one icacls complaint becomes an
        # exception the call site degrades into a warning, and the whole permission pass
        # silently stops happening -- the product round would stay green.
        # This step is also the ONLY place scenario 6 gets its evidence: the container has
        # no icacls, so "inheritance really breaks" and "children follow by dynamic
        # inheritance" (the premise for normalizing the whole tree with one call) can only
        # be shown here. The fixture seeds BUILTIN\Users on the outer dir first, so the
        # baseline is real exposure, not whatever the runner image happens to grant.
        # Body must stay pure ASCII (see the host probe step). Ranked at the tail for the
        # same reason as the three steps above it.
        shell: powershell
        timeout-minutes: 10
        run: |
          & "$PWD\test_perms_logic.ps1"
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Windows PowerShell 5.1 cannot run permission surface logic: rc=$LASTEXITCODE"
              exit 1
          }

      - name: Backup round on Windows PowerShell 5.1
        # THE face this job had never touched: Task Scheduler registers
        #   powershell.exe -ExecutionPolicy Bypass -File backup.ps1
        # i.e. Windows PowerShell 5.1, while every other step here runs the product under pwsh 7.
        # Measured on this host (probe fact 3, run 37003329872): under
        # $ErrorActionPreference="Stop" a native command that writes ONE line to stderr raises a
        # terminating exception in 5.1 (all three shapes: 2>&1|Tee, 2>$null, 2>&1|Out-Null) and
        # does not in pwsh 7. restic progress and rclone's NOTICE lines live on stderr, so the
        # real Windows nightly could not have finished a round - while the pwsh-based round above
        # stayed green through the whole observation window.
        # This step runs the product a SECOND time in the same job, on the repos the pwsh round
        # already created. That is deliberate: it also walks the idempotent branch
        # ("restic init" on an existing repository), which is the call every nightly from the
        # second run onwards steps on.
        # Assertions, in the order that makes the diagnosis readable (AGENTS §3):
        #   1) rc=0 and the COMPLETE line -> nothing threw its way out of the round;
        #   2) a MANIFEST.txt newer than this round started -> the plaintext layer really
        #      produced artifacts under 5.1. Without this, the semantic layer's own
        #      `catch { Write-Warning "[semantic] ..." }` turns a total loss of the layer into
        #      one warning line and the round still prints FULLY COMPLETE;
        #   3) the layer's own "[ OK ] [semantic]" completion line is present and no
        #      RemoteException/NativeCommandError text appears anywhere -> the bypass really ran
        #      (every degradation path inside semantic.ps1 returns before that OK line).
        # Body is pure ASCII, including every pattern: Actions writes the run body to a temp .ps1
        # without BOM, and 5.1 then decodes Chinese as CP1252 - where 0x91-0x94 are curly quotes,
        # which PowerShell takes for string delimiters (run 36991285809 died on `Missing closing
        # '}'), while other byte values mojibake quietly and leave a Chinese -match pattern
        # matching NOTHING while the step still prints green (AGENTS §2).
        shell: powershell
        timeout-minutes: 25
        env:
          SKIP_WEBDAV: "1"
        run: |
          $ErrorActionPreference = "Continue"
          $env:PATH = "$env:RUNNER_TEMP\bin;$env:PATH"
          $env:BACKUP_BASE = "$env:RUNNER_TEMP\repos"
          $startedAt = Get-Date
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$PWD\backup.ps1" -Task Backup 2>&1
          $code = $LASTEXITCODE
          $text = $out | Out-String
          if ($code -ne 0) {
              Write-Host "::error::backup.ps1 under Windows PowerShell 5.1 exited $code - a native stderr line probably became a terminating exception"
              Write-Host "--- last 30 lines of the 5.1 round ---"
              Write-Host (($out | Select-Object -Last 30) -join "`n")
              exit 1
          }
          if ($text -notmatch 'FULLY COMPLETE') {
              Write-Host "::error::5.1 round exited 0 without the COMPLETE line"
              Write-Host (($out | Select-Object -Last 15) -join "`n")
              exit 1
          }
          $manifest = Get-ChildItem "$env:BACKUP_BASE\timeline" -Recurse -Filter "MANIFEST.txt" -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $manifest) {
              Write-Host "::error::no MANIFEST.txt anywhere under the timeline root - the semantic layer produced nothing on this host"
              exit 1
          }
          if ($manifest.LastWriteTime -lt $startedAt) {
              Write-Host "::error::newest MANIFEST.txt is from an earlier round ($($manifest.LastWriteTime.ToString('u')), this round started $($startedAt.ToString('u'))) - the 5.1 round did not produce plaintext"
              exit 1
          }
          # 3) the layer's own success line (semantic.ps1 writes "[ OK ] [semantic] ..." only after
          #    generate produced the timeline; every degradation path returns before it). The check
          #    is ASCII on purpose: Actions writes this body to a temp .ps1 WITHOUT BOM, so any
          #    Chinese in it is CP1252 mojibake on this host and the pattern would match nothing -
          #    a dead assertion that still prints green.
          if ($text -notmatch '\[ OK \] \[semantic\]') {
              Write-Host "::error::the semantic bypass never reported its OK line - it degraded quietly"
              Write-Host (($out | Select-String -Pattern 'semantic' | Select-Object -Last 5) -join "`n")
              exit 1
          }
          # 4) no native-command exception signature anywhere: those two strings are exactly what
          #    5.1 turns a stderr line into under Stop (probe fact 3), and they are ASCII, so they
          #    survive this host's decoding.
          if ($text -match 'RemoteException|NativeCommandError') {
              Write-Host "::error::a native command raised in this scope - the ErrorActionPreference=Continue cover is missing somewhere"
              Write-Host (($out | Select-String -Pattern 'RemoteException|NativeCommandError' | Select-Object -First 3) -join "`n")
              exit 1
          }
          Write-Host "=== 5.1 backup round OK: rc=0, plaintext fresh at $($manifest.FullName) ==="
          exit 0

      - name: Push debug logs
        if: failure()
        shell: pwsh
        run: |
          $tok = "${{ github.token }}"
          $h = @{ Authorization = "Bearer $tok"; Accept = "application/vnd.github+json" }
          $base = "https://api.github.com/repos/${{ github.repository }}"
          # 分支受签名规则保护，改用 release 资产承载调试日志（匿名可下载）
          $tag = "debug-$(Get-Date -Format yyyyMMddHHmmss)"
          $rel = Invoke-RestMethod -Method Post "$base/releases" -Headers $h -ContentType "application/json" `
            -Body (@{ tag_name = $tag; name = $tag; body = "CI debug transcript" } | ConvertTo-Json)
          $diag = Get-Content "$env:RUNNER_TEMP\diag.txt" -Raw -ErrorAction SilentlyContinue
          if (-not $diag) { $diag = "(no diag captured)" }
          $uploadUrl = ($rel.upload_url -replace '\{.*\}', "?name=diag.txt")
          Invoke-RestMethod -Method Post $uploadUrl -Headers $h -ContentType "text/plain" -Body $diag | Out-Null
          Write-Host "uploaded diag to release $tag"
