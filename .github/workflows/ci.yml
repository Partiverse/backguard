# Partiverse Backup System — 三平台 CI
# 真实 OS runner 上验证核心备份流程：装依赖 → 写测试配置 → 跑 backup → 断言归档
# CI 不推云端（SKIP_WEBDAV=1，windows job 仍要下载 restic/rclone），密码为一次性随机值，仅存于 runner 内存
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支只留最新一轮：2026-10-01 02:47 实测，连推 8 个提交后 macOS job 排队 36 分钟
# 一个都没开跑——每轮 2 个 macOS job，8 轮就是 16 个任务在免费 macOS runner 池里互相顶死，
# 结果「唯一需要绿灯的 HEAD」反而排在最后。旧提交是被 HEAD 完全包含的祖先（且多为纯文档），
# 它们的 verdict 对部署点没有意义，取消掉把池子让给 HEAD。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 每个 job 与每个 E2E step 都设 timeout-minutes：默认 360 分钟意味着一步卡住（等 tty
# 提示、borg 锁、下载挂起）能白烧 6 小时 macOS 额度，而且 step 只有结束才上传日志——
# 卡住时什么都读不到，`gh run cancel` 也要等 runner 自己检查。预算按 10-01 CI 实测写：
# macos job 88 分钟（20:31:49Z→21:59:14Z），单步最长是 drill E2E 的 28m22s，
# 所以 step 级预算 40 分钟——35 分钟只剩 23% 余量，免费 runner 抖一下就把「慢」判成
# 「假失败」，白烧一轮 90 分钟；抬到 40 的代价只在真卡住时多等 5 分钟/步。

jobs:
  semantic:
    # 语义层（research/06）单元测试 + demo E2E + zipapp 构建，三平台轻量矩阵
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s semantic -p "test_*.py" -v
      - name: Demo E2E
        shell: bash
        run: |
          python semantic/bg_semantic.py demo --out demo_output
          # 时间轴根下**没有**设备名一层（2026-10-01 起）：demo 的 out_root 直接就是 YYYY/MM/DD。
          # 这条正断言同时是反向守卫——若设备层回来，路径变成 demo_output/<dev>/YYYY/…，
          # 这里的 test -f 当场失败（10-01 就是这步没跟着改，三平台 semantic 一起红）
          base=demo_output/2026/09/28/2100-evening
          test -f "$base/MANIFEST.txt" || { echo "::error::MANIFEST.txt 缺失"; exit 1; }
          test -f "$base/STORY.md"    || { echo "::error::STORY.md 缺失"; exit 1; }
          test -f "$base/restore.md"  || { echo "::error::restore.md 缺失"; exit 1; }
      - name: Zipapp in sync with source
        shell: bash
        run: |
          set -euo pipefail
          # 生产上 semantic.sh 优先执行仓库里的 bg.pyz：改了源没重建 pyz，夜间跑的就是旧代码。
          # 必须跑在下一步「Build zipapp」之前——那一步会就地覆盖 semantic/bg.pyz，之后比对必然相等
          diff <(tail -n +2 semantic/bg.pyz) <(tail -n +2 semantic/bg_semantic.py) > /dev/null \
            || { echo "::error::semantic/bg.pyz 与 bg_semantic.py 不同步——重新 zipapp 并与源同提交"; exit 1; }
      - name: Build zipapp
        run: python -m zipapp semantic/bg_semantic.py -o semantic/bg.pyz -p "/usr/bin/env python3"

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq borgbackup rclone shellcheck age expect restic

      - name: Lint
        run: |
          shellcheck --version
          shellcheck -S warning -f gcc backup.sh restore.sh semantic/semantic.sh drill.sh rescue.sh ui.sh install-webui.sh 2>&1 | tee /tmp/lint.txt
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -E '^[^ :]+:[0-9]+:[0-9]+' /tmp/lint.txt | sed 's/^/::error::/' | head -20 || true
            exit "$rc"
          fi

      - name: Prepare test config
        run: |
          mkdir -p ~/.config/partiverse-backup ~/ci-data/docs ~/ci-data/pics
          echo "test $(date)" > ~/ci-data/docs/hello.txt
          echo "pic" > ~/ci-data/pics/pic.txt
          cat > ~/.config/partiverse-backup/config.sh <<CFG
          export PLATFORM="linux"
          export DEVICE_ID="ci-linux"
          export SYSTEM_ID="ci-linux"
          export BACKUP_BASE="\$HOME/ci-repos"
          export RCLONE="\$(command -v rclone)"
          export BORG="\$(command -v borg)"
          export RESTIC=""
          export WEBDAV_REMOTE=""
          export WEBDAV_ROOT=""
          BORG_INCLUDES_config=("\$HOME/ci-data/docs/")
          BORG_EXCLUDES_config=("--exclude" "**/*.log")
          BORG_INCLUDES_files=("\$HOME/ci-data/pics/")
          BORG_EXCLUDES_files=()
          BORG_INCLUDES_system=("\$HOME/ci-data/docs/")
          BORG_EXCLUDES_system=()
          CFG
          echo "BORG_PASSPHRASE='ci-$(openssl rand -hex 12)'" > ~/.config/partiverse-backup/secrets.env

      - name: Prepare age identity
        run: |
          set -euo pipefail
          # 一次性主身份密钥（仅存于 runner）。没有 age 密钥时 seal_manifest 跳过密封、
          # run_drill 直接 rc=20「未执行」——10-01 那个跨类别取回错配就藏在这层遮罩下：
          # CI 从未真跑过演练，修好了也没有断言。配好密钥让演练路径在 CI 里常驻。
          dir="$HOME/.config/partiverse-backup/age"
          mkdir -p "$dir"
          age-keygen -o "$dir/identity.txt" 2>/dev/null
          chmod 600 "$dir/identity.txt"
          sed -n 's/^# public key: \(age1[0-9a-z]*\).*/\1/p' "$dir/identity.txt" > "$dir/recipients.txt"
          [ -s "$dir/recipients.txt" ] || { echo "::error::recipients.txt 公钥提取失败"; exit 1; }

      - name: Run backup
        timeout-minutes: 40
        run: ./backup.sh
        env:
          SKIP_WEBDAV: "1"

      - name: Assert archives exist
        run: |
          set -euo pipefail
          source ~/.config/partiverse-backup/secrets.env
          export BORG_PASSPHRASE
          for cls in config files system; do
            count=$(borg list --json "$HOME/ci-repos/borg-$cls" | python3 -c "import sys,json;print(len(json.load(sys.stdin)['archives']))")
            echo "$cls: $count archive(s)"
            [ "$count" -ge 1 ] || { echo "::error::$cls 无归档"; exit 1; }
          done

      - name: Assert semantic timeline
        run: |
          set -euo pipefail
          manifest=$(find "$HOME/ci-repos/timeline" -name MANIFEST.txt | head -1)
          [ -n "$manifest" ] || { echo "::error::timeline 无 MANIFEST.txt"; exit 1; }
          echo "--- $manifest ---"
          cat "$manifest"

      - name: Assert restore drill ran clean
        run: |
          set -euo pipefail
          # rescue-test.txt 缺失 = run_drill 走了 rc=20（缺 age/主身份/密封清单或无归档），
          # 也就是「演练被静默跳过」，绝不能算通过。
          # maxdepth 1 而不是 2：新形状下它在时间轴根级，写成 2 会把「设备层又回来了」
          # 一并放过（旧的 <timeline>/<dev>/rescue-test.txt 同样命中），那条回归就没人在场
          rt=$(find "$HOME/ci-repos/timeline" -maxdepth 1 -name rescue-test.txt | head -1)
          if [ -z "$rt" ]; then
            # 把根级实际形状打出来：分不清「演练没跑」还是「设备层又长回来了」
            find "$HOME/ci-repos/timeline" -maxdepth 1 2>&1 | head -10 || true
            echo "::error::根级无 rescue-test.txt：演练未执行（缺主身份/密封清单），或时间轴又多了一层设备目录"
            exit 1
          fi
          echo "--- $rt ---"
          cat "$rt"
          if grep -qE '^FAIL |^RESULT: FAIL' "$rt"; then
            echo "::error::恢复演练有失败项"; exit 1
          fi
          grep -qE '^RESULT: [1-9][0-9]* PASS / 0 FAIL' "$rt" \
            || { echo "::error::演练结论行缺失或抽样为 0"; exit 1; }

      - name: E2E multi-target (rclone local backend)
        timeout-minutes: 40
        run: |
          set -euo pipefail
          # 脚本自带隔离的 rclone.conf（local 后端假 remote），不触网不碰真实配置
          bash test_multi_target.sh "$PWD"

      - name: Unit timeline retention (prune_local_timeline)
        run: |
          set -euo pipefail
          bash test_timeline_retention.sh

      - name: E2E redline cloud append-only
        timeout-minutes: 40
        run: |
          set -euo pipefail
          # 静态守卫：全仓脚本不得出现 rclone sync（云端只增不减）
          bash test_cloud_copy_only.sh

      - name: E2E portable file attrs
        timeout-minutes: 40
        run: |
          set -euo pipefail
          # GNU 语义 stat shim 顶在 PATH 前：Linux 上文件属性探测必须仍然正确
          bash test_portable_stat.sh

      - name: E2E init wizard + scheduler templates
        timeout-minutes: 40
        run: |
          set -euo pipefail
          # 装机向导在隔离 HOME 跑完整首备，并断言调度模板（systemd unit / launchd
          # plist 按平台）不把明文口令写进无保护文件——新设备接入面的一次实跑
          bash test_init_e2e.sh

      - name: E2E restore recovery paths
        timeout-minutes: 40
        run: |
          set -euo pipefail
          # 真实 borg 仓库：--list / --archive --list / --latest / --id 四条路径实取回
          bash test_restore_e2e.sh

      - name: E2E cloud push failure visible
        timeout-minutes: 40
        run: |
          set -euo pipefail
          # 只读目标使 rclone copy 失败：必须非零退出 + 告警，解除后恢复 FULLY COMPLETE
          # （root 下 chmod 只读不生效，脚本自身会 E2E-SKIP）
          bash test_cloud_failure.sh

      - name: E2E standalone drill entry
        timeout-minutes: 40
        run: |
          set -euo pipefail
          # 真实 borg 仓库 + 真实 age 密封：解封 → 抽样 → 实取 → 结论判定不得误报
          bash test_drill_e2e.sh

      - name: E2E standalone rescue entry
        timeout-minutes: 40
        run: |
          set -euo pipefail
          # 单文件逃生恢复：两种目录布局 / borg+restic 搜与取 / age 双路径（expect 驱动 tty）
          bash test_rescue_e2e.sh

      - name: E2E log rotation + run boundary line
        timeout-minutes: 40
        run: |
          set -euo pipefail
          # 现役日志只装本轮：超阈值才切、副本封顶 SEM_LOG_KEEP、删除只认轮转形态
          # （宽 glob + 两道守卫）；run 边界行一轮一行并如实带失败轮的 rc
          bash test_log_rotation.sh

      - name: E2E cloud copy self-proof
        timeout-minutes: 40
        run: |
          set -euo pipefail
          # A6 L1：推送报成功之后按「清单单向包含 + 仓库 config 内容哈希」自证云端副本。
          # 同长度改写（rclone 只比大小看不见的那类）须被当场 forcing 补传并记 HEALED，
          # 网盘读不出记 UNKNOWN 且不改退出码，补传后复核仍不符才是 FAIL
          bash test_cloud_verify.sh

      - name: E2E repository integrity check
        timeout-minutes: 40
        run: |
          set -euo pipefail
          # A2a：按月把引擎仓库整仓读一遍（borg check --verify-data）。这类损坏不会让
          # borg create 失败——现有守卫全绿也看不见它，所以必须单独有一步
          bash test_integrity.sh

      - name: E2E restic retention reclaims bytes
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # restic 分支（backup.sh 的 windows 路径 + backup.ps1 的同一条命令）：这一发跑的是
          # 真 restic，测「-r 在位」「forget 带 --prune 且字节真的回收」「回收后仓库还读得动」，
          # 以及两份实现对 rc=3 / rc=12 判得不一样时的可见性。restic 只装在 linux job
          # （apt 那行）；macos job 没装，同一条夹具在那边会打 E2E-SKIP 后如实退
          bash test_restic_retention.sh

      - name: E2E status line (A1 foundation)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # A1 状态地基（research/12 §5）：真 borg 跑两轮 backup.sh，STATUS.jsonl 每轮追加一行、
          # 逐行合法 JSON、零文件名零绝对路径（红线 §1.1——这份文件随 timeline 上云）。
          # borg + python3 都在 linux job 的 apt 那一行里
          bash test_status_line.sh

      - name: E2E webui read-only page
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # A2 本地只读状态页（webui.py）：白名单路由 + 最新快照语义 + 隐私诱饵
          # （runs/*.json、rescue-test、preflight、密封件里埋 token，任何响应不许出现）+
          # 只读（POST 不通）+ 拒绝非回环绑定。零备份轮，秒级
          bash test_webui.sh

      - name: E2E month jump (low-frequency paths compose)
        timeout-minutes: 40
        run: |
          set -euo pipefail
          # 把时间推过一个月（touch -t 两个产物的 mtime，不碰 OS 时钟）：完整性窗口与演练
          # 窗口同夜重开、云端自证的「单向包含」由**真实保留策略**裁出来、报告晚一轮上云、
          # 轮转与边界行在同一夜。四条低频路径的组合面是单项夹具造不出来的（roadmap §11 A2b 后）
          bash test_month_jump.sh

      - name: E2E BSD-only branch probe (no backup round)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # 从生产文件里**切**出纯函数（哈希轮流域 / 本地清单 / lsl 行解析 / 目录级脱敏 /
          # date -r / 演练 fail-closed），对着 python3 现算的真相断言。零备份轮，几秒。
          # macos 车道也跑同一步——两边的哈希轮流域正好互补
          bash test_bsd_probe.sh

  macos:
    runs-on: macos-latest
    # 车道分配是量出来的，不是排出来的（docs/HANDOVER §11 的 10-02 午后块有逐 step 墙钟）：
    # 免费 macos runner 上一个整轮 backup.sh 要 6–13 分钟，同一份夹具在 linux 是 0.1–1 分钟。
    # 59e4c9d 那次「把新覆盖排在前面」的修法前提错了——这条 runner 上没有一步是便宜的：
    # backup 13m / restore 13.6m / rescue 10.7m / init 11.8m / log_rotation 34.7m，
    # 而 integrity 一步（六个整轮）在 step 级 40 分钟被砍（`E2E repository integrity check`
    # = failure），后面 cloud_verify / cloud_failure / drill 一秒没跑，整轮 126 分钟。
    # 所以这四套重夹具退回 linux-only（那边四套合计 <2 分钟），macos 只留**整轮型且形状
    # 敏感**的（borg extract 的 cwd 语义、launchd plist、ls/rm/wc 的 BSD 行为），BSD 独有的
    # 纯函数分支由零备份轮的 test_bsd_probe.sh 兜住。
    # 预算 180 = 本车道现在约 90 分钟 + 一倍余量；红一轮＝今晚没有可部署的 HEAD（§4.1）
    timeout-minutes: 180
    # macOS 自带 bash 3.2 不支持 declare -A / nameref，脚本需要 bash 5
    defaults:
      run:
        shell: /opt/homebrew/bin/bash -e {0}
    steps:
      - uses: actions/checkout@v4

      - name: Install bash 5 and deps
        shell: bash
        run: |
          brew install bash borgbackup rclone age
          /opt/homebrew/bin/bash --version | head -1

      - name: Prepare test config
        run: |
          mkdir -p ~/.config/partiverse-backup ~/ci-data/docs ~/ci-data/pics
          echo "test $(date)" > ~/ci-data/docs/hello.txt
          cat > ~/.config/partiverse-backup/config.sh <<CFG
          export PLATFORM="macos"
          export DEVICE_ID="ci-macos"
          export SYSTEM_ID="ci-macos"
          export BACKUP_BASE="\$HOME/ci-repos"
          export RCLONE="\$(command -v rclone)"
          export BORG="\$(command -v borg)"
          export RESTIC=""
          export WEBDAV_REMOTE=""
          export WEBDAV_ROOT=""
          BORG_INCLUDES_config=("\$HOME/ci-data/docs/")
          BORG_EXCLUDES_config=("--exclude" "**/*.log")
          BORG_INCLUDES_files=("\$HOME/ci-data/pics/")
          BORG_EXCLUDES_files=()
          BORG_INCLUDES_system=("\$HOME/ci-data/docs/")
          BORG_EXCLUDES_system=()
          CFG
          echo "BORG_PASSPHRASE='ci-$(openssl rand -hex 12)'" > ~/.config/partiverse-backup/secrets.env

      - name: Prepare age identity
        run: |
          set -euo pipefail
          # 同 linux job：没有 age 主身份，run_drill 一律 rc=20 静默跳过演练
          dir="$HOME/.config/partiverse-backup/age"
          mkdir -p "$dir"
          age-keygen -o "$dir/identity.txt" 2>/dev/null
          chmod 600 "$dir/identity.txt"
          sed -n 's/^# public key: \(age1[0-9a-z]*\).*/\1/p' "$dir/identity.txt" > "$dir/recipients.txt"
          [ -s "$dir/recipients.txt" ] || { echo "::error::recipients.txt 公钥提取失败"; exit 1; }

      - name: Run backup
        timeout-minutes: 40
        run: ./backup.sh
        env:
          SKIP_WEBDAV: "1"

      - name: Assert archives exist
        run: |
          set -euo pipefail
          source ~/.config/partiverse-backup/secrets.env
          export BORG_PASSPHRASE
          for cls in config files system; do
            count=$(borg list "$HOME/ci-repos/borg-$cls" | wc -l | tr -d ' ')
            echo "$cls: $count archive(s)"
            [ "$count" -ge 1 ] || { echo "::error::$cls 无归档"; exit 1; }
          done

      - name: Assert semantic timeline
        run: |
          set -euo pipefail
          manifest=$(find "$HOME/ci-repos/timeline" -name MANIFEST.txt | head -1)
          [ -n "$manifest" ] || { echo "::error::timeline 无 MANIFEST.txt"; exit 1; }
          echo "--- $manifest ---"
          cat "$manifest"

      - name: Assert restore drill ran clean
        run: |
          set -euo pipefail
          rt=$(find "$HOME/ci-repos/timeline" -maxdepth 1 -name rescue-test.txt | head -1)
          if [ -z "$rt" ]; then
            # 把根级实际形状打出来：分不清「演练没跑」还是「设备层又长回来了」
            find "$HOME/ci-repos/timeline" -maxdepth 1 2>&1 | head -10 || true
            echo "::error::根级无 rescue-test.txt：演练未执行（缺主身份/密封清单），或时间轴又多了一层设备目录"
            exit 1
          fi
          echo "--- $rt ---"
          cat "$rt"
          if grep -qE '^FAIL |^RESULT: FAIL' "$rt"; then
            echo "::error::恢复演练有失败项"; exit 1
          fi
          grep -qE '^RESULT: [1-9][0-9]* PASS / 0 FAIL' "$rt" \
            || { echo "::error::演练结论行缺失或抽样为 0"; exit 1; }

      # BSD 平台专属回归：borg extract 的 cwd 相对语义 + 只读云端目标的失败可见性
      - name: E2E restore recovery paths
        timeout-minutes: 40
        run: /opt/homebrew/bin/bash test_restore_e2e.sh

      # 系统自带 /usr/bin/expect：恢复码（路径 B）的 tty 交互分支在 BSD 上同样要跑
      - name: E2E standalone rescue entry
        timeout-minutes: 40
        run: /opt/homebrew/bin/bash test_rescue_e2e.sh

      # BSD 上 plist 模板才是主角：口令不落 LaunchAgents、日志路径在位
      - name: E2E init wizard + scheduler templates
        timeout-minutes: 40
        run: /opt/homebrew/bin/bash test_init_e2e.sh

      # 真机调度就是 launchd：日志轮转与边界行在 BSD 的 ls/rm/wc 上必须同样成立。
      # 实测这一步在 macos runner 上 34.7 分钟（本机 <1 分钟），40 分钟的 step 上限只差
      # 5 分钟就误杀——按整轮数放 60
      - name: E2E log rotation + run boundary line
        timeout-minutes: 60
        run: /opt/homebrew/bin/bash test_log_rotation.sh

      # 零备份轮的 BSD 分支探针：sha256sum/shasum 轮流域、date -r、rclone lsl 含空格路径、
      # 目录级脱敏、演练 fail-closed。这四类恰好是被从这条车道摘掉的那四套夹具里
      # 「只有 BSD 会出问题」的那部分，而它们全是纯函数——不跑一轮备份就能测完（本机 <5 秒）。
      # 上面 "Assert restore drill ran clean" 仍然在本车道实跑一次真演练，A2b 的内容哈希那一维
      # 因此在 BSD 上有真机形状；判定逻辑由这一步兜住
      - name: E2E BSD-only branch probe (no backup round)
        timeout-minutes: 10
        run: /opt/homebrew/bin/bash test_bsd_probe.sh

      - name: E2E webui installer render surface
        timeout-minutes: 10
        run: /opt/homebrew/bin/bash test_webui_install.sh
        # webui 常驻 agent 的「渲染面」：plutil -lint + 键面（Label/RunAtLoad/KeepAlive/日志路径）
        # + 凭据纪律（webui 不读口令，模板一个凭据字样都不许长出来）+ WEBUI_NO_REGISTER 下
        # 不落真实 LaunchAgents。只渲染不注册——launchctl 动的是 runner 真实的 launchd 域；
        # 注册那半边（bootstrap 后 10s 内 8334 起 200）由脚本自带的现场判据在真机装的时候证。

  windows:
    runs-on: windows-latest
    # 60→90（10-02）：这个 job 现在有**两**步各自要跑一整轮真产品脚本（日志轮转接线、A2a 接线），
    # 而各步 step 级超时之和（40+20+25+20+20）早就大于 job 级 60——只要有一轮慢一点，被砍的一定是
    # 队尾，而队尾恰好是这一轮新加的覆盖（§3 在 macos 那轮实测过同一件事：免费 runner 上被超时
    # 砍掉的永远是清单尾部）。
    # **实测用量已有一手数据（run 37003329872 的 windows job，逐 step 时间戳）**：Set up job 起
    # 到 Post checkout 止共 1 分 42 秒，其中最重的「Run backup and assert」23 秒、子进程跑整轮的
    # 「Assert cloud push failure is visible」14 秒、四步 5.1 逻辑测试合计 1 秒。所以 90 是余量
    # 而不是需求，「25 分钟一轮」那个数从来是猜的（写在探针步的注释里，已就地更正）。这一档 runner
    # 慢在 Install deps 的两个下载上，不在产品轮；被超时砍掉的风险在这里主要是排队而不是执行。
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        shell: pwsh
        run: |
          $binDir = "$env:RUNNER_TEMP\bin"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          # restic 0.19+ Windows 资产为 .zip（旧版为 .exe），两者兼容处理
          $ver = $null
          try {
            $rel = Invoke-RestMethod "https://api.github.com/repos/restic/restic/releases/latest" -TimeoutSec 30
            $ver = $rel.tag_name.TrimStart('v')
          } catch { Write-Host "::warning::GitHub API 不可用: $($_.Exception.Message)" }
          if (-not $ver) { $ver = "0.17.3" }
          $base = "https://github.com/restic/restic/releases/download/v$ver"
          $exeUrl = "$base/restic_${ver}_windows_amd64.exe"
          $zipUrl = "$base/restic_${ver}_windows_amd64.zip"
          curl.exe -fsSL -o "$binDir\restic.exe" $exeUrl
          if ($LASTEXITCODE -ne 0) {
            Write-Host "exe 资产不可用 (404?)，改用 zip: $zipUrl"
            curl.exe -fsSL -o "$env:RUNNER_TEMP\restic.zip" $zipUrl
            if ($LASTEXITCODE -ne 0) { Write-Error "restic 下载失败 exe 与 zip 均失败"; throw "restic download failed" }
            Expand-Archive "$env:RUNNER_TEMP\restic.zip" -DestinationPath $binDir -Force
            # zip 内文件名为 restic_<ver>_windows_amd64.exe，需改名
            $exe = Get-ChildItem "$binDir" -Recurse -Filter "restic*.exe" | Select-Object -First 1
            if (-not $exe) { Write-Error "zip 内未找到 restic 可执行文件"; throw "no restic exe in zip" }
            if ($exe.FullName -ne "$binDir\restic.exe") { Move-Item $exe.FullName "$binDir\restic.exe" -Force }
          }
          if ((Get-Item "$binDir\restic.exe").Length -lt 1MB) { throw "restic.exe 尺寸异常" }
          # age：rescue.ps1 的账本解封（路径 A 用主身份、路径 B 用恢复码）与 test_rescue_e2e.ps1
          # 的真 age 那几段都要它。restic / age / age-keygen 任一不在 PATH，夹具就把真引擎那二十二段
          # （场景 3–24）整段 Skip——Skip 不是通过。
          # 版本钉住而不是问 API 要 latest：下载失败应当当场报红，而不是下一轮悄悄换了个二进制。
          $ageVer = "1.2.1"
          curl.exe -fsSL -o "$env:RUNNER_TEMP\age.zip" `
            "https://github.com/FiloSottile/age/releases/download/v$ageVer/age-v$ageVer-windows-amd64.zip"
          if ($LASTEXITCODE -ne 0) { Write-Error "age 下载失败"; throw "age download failed" }
          Expand-Archive "$env:RUNNER_TEMP\age.zip" -DestinationPath "$env:RUNNER_TEMP\agesetup" -Force
          Move-Item "$env:RUNNER_TEMP\agesetup\age\age.exe" "$binDir\age.exe" -Force
          Move-Item "$env:RUNNER_TEMP\agesetup\age\age-keygen.exe" "$binDir\age-keygen.exe" -Force
          if ((Get-Item "$binDir\age.exe").Length -lt 1MB) { throw "age.exe 尺寸异常" }
          curl.exe -fsSL -o "$env:RUNNER_TEMP\rclone.zip" "https://downloads.rclone.org/rclone-current-windows-amd64.zip"
          Expand-Archive "$env:RUNNER_TEMP\rclone.zip" -DestinationPath $binDir -Force
          Move-Item "$binDir\rclone-*-windows-amd64\rclone.exe" "$binDir\rclone.exe" -Force
          Add-Content $env:GITHUB_PATH $binDir
          & "$binDir\restic.exe" version
          & "$binDir\age.exe" --version

      - name: Prepare test config
        shell: pwsh
        run: |
          $conf = "$env:APPDATA\PartiverseBackup"
          New-Item -ItemType Directory -Force -Path $conf | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\docs", "$env:RUNNER_TEMP\pics" | Out-Null
          "test $(Get-Date)" | Out-File "$env:RUNNER_TEMP\docs\hello.txt"
          @"
          `$env:DEVICE_ID = "ci-windows"
          `$env:SYSTEM_ID = "ci-windows"
          `$env:BACKUP_BASE = "$env:RUNNER_TEMP\repos"
          `$env:WEBDAV_REMOTE = ""
          `$env:WEBDAV_ROOT = ""
          `$RESTIC_INCLUDES_config = "$env:RUNNER_TEMP\docs"
          `$RESTIC_EXCLUDES_config = "*.log"
          `$RESTIC_INCLUDES_files = "$env:RUNNER_TEMP\pics"
          `$RESTIC_EXCLUDES_files = ""
          `$RESTIC_INCLUDES_system = "$env:RUNNER_TEMP\docs"
          `$RESTIC_EXCLUDES_system = ""
          "@ | Out-File "$conf\config.ps1" -Encoding utf8
          "RESTIC_PASSWORD='ci-$(-join ((1..24) | ForEach-Object { '{0:x}' -f (Get-Random -Max 16) }))'" |
            Out-File "$conf\secrets.env" -Encoding utf8

      - name: Prepare age identity
        shell: pwsh
        run: |
          # 与 linux/macos 那两步同一条理由（本文件 :110 / :335）：没有主身份时 seal_manifest
          # 静默跳过、Invoke-Drill 直接 return Code 20「未执行」，于是 Windows 的演练这条生产面
          # 等于从没在 CI 里跑过，修好了也没有断言。一次性密钥，仅存于 runner。
          # recipients.txt 必须非空：`age -R` 对着空公钥文件会「成功」密封出一份谁也解不开的东西。
          $ageDir = Join-Path $env:APPDATA "PartiverseBackup\age"
          New-Item -ItemType Directory -Force -Path $ageDir | Out-Null
          & age-keygen -o (Join-Path $ageDir "identity.txt") 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::age-keygen failed"; throw "age-keygen rc=$LASTEXITCODE" }
          $id = Get-Content (Join-Path $ageDir "identity.txt") |
              Where-Object { $_ -match '^# public key: (age1[0-9a-z]*)$' } |
              ForEach-Object { $Matches[1] }
          if (-not $id) { Write-Host "::error::public key extraction failed"; throw "no age public key" }
          [System.IO.File]::WriteAllText((Join-Path $ageDir "recipients.txt"), ($id + "`n"))
          # 自证一句「身份真的解得开」：建件→解件，两端都过才继续（否则后面每一发红都是歧义的）
          $probe = Join-Path $env:RUNNER_TEMP "age-probe.txt"
          [System.IO.File]::WriteAllText($probe, "bg-age-probe")
          & age -R (Join-Path $ageDir "recipients.txt") -o "$probe.enc" $probe
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::age encrypt failed"; throw "age -R rc=$LASTEXITCODE" }
          & age -d -i (Join-Path $ageDir "identity.txt") -o "$probe.out" "$probe.enc"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::age decrypt failed"; throw "age -d rc=$LASTEXITCODE" }
          if (([System.IO.File]::ReadAllText("$probe.out")) -ne "bg-age-probe") {
              Write-Host "::error::age roundtrip content mismatch"; throw "age roundtrip"
          }
          Write-Host "age identity ready at $ageDir"

      - name: Log rotation + run boundary logic
        # A4 的**逻辑**那一半：从 backup.ps1 里按哨兵标记原样切出 Rotate-LogFile /
        # Write-RunBoundary / Get-RunGitSha 跑一遍，几秒收敛。排在产品轮之前是故意的——
        # 它不碰仓库也不碰网络，红的话不该带走同一轮里 25 分钟的产品断言（§3「步骤顺序就是
        # 优先级」）。**接线**（备份轮真的调用了吗、边界行落在哪个出口）由本 job 后面的
        # 「Assert log rotation and run boundary wiring」在真 Windows 文件系统上验。
        shell: pwsh
        timeout-minutes: 10
        run: |
          & "$PWD\test_log_rotation_logic.ps1"
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::日志轮转/run 边界逻辑测试 rc=$LASTEXITCODE——见上面的 FAIL 行"
              exit 1
          }

      - name: Cloud verify logic (A6)
        # A6 云端自证的**逻辑**那一半：从 backup.ps1 按哨兵标记切出 Format-CloudDest /
        # Test-VerifyPrefix / Test-VerifyConfigHash / Invoke-CloudVerify 跑一遍。排在 25 分钟的
        # 产品轮之前，同上一条的口径：它不碰真实仓库也不碰网络，红了不该把同轮的产品结论带走。
        # **这里比本地容器跑得更宽**：runner 上 rclone 已由上面的 Install deps 装好并进 PATH，
        # 所以场景 8 那几段「拿真 rclone 读写一个本地目录当云端」会真的执行，而容器里 rclone
        # 不在 PATH 时它们整段 Skip；NTFS 上 `IsReadOnly` 是真挡得住替换的（Linux 宿主上 rclone
        # 非原地写 + root 无视只读位，场景 8h 只能如实 Skip），所以「补传后仍不一致 → FAIL」
        # 这一支只有在这台宿主上才第一次被走到。网盘语义（比较只看 size）仍然复现不了——
        # 那部分证明属于 bash 侧 test_cloud_verify.sh 的撒谎桩，见该文件台账。
        shell: pwsh
        timeout-minutes: 10
        run: |
          & "$PWD\test_cloud_verify_logic.ps1"
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::云端自证逻辑测试 rc=$LASTEXITCODE——见上面的 FAIL 行"
              exit 1
          }

      - name: Repository integrity logic (A2a)
        # A2a 存储完整性校验的**逻辑**那一半：从 backup.ps1 按哨兵标记切出 Test-IntegrityDue /
        # Invoke-ResticCheck / Write-IntegrityReport / Invoke-IntegrityCheck 单独跑。排在产品轮
        # 之前是同一条口径（上面两步一样）：它只动临时目录里的桩，红了不该把同轮产品结论带走。
        # **这里比本地容器跑得更宽**：restic 已由 Install deps 装好进 PATH，所以场景9
        # 「拿真 restic 建一个仓库、翻掉 pack 一个字节、要求判 FAIL」会真的执行——容器里没有
        # restic 时它整段 Skip，而这一支正是「rc=1 只由真损坏换来」唯一的现场证据。
        shell: pwsh
        timeout-minutes: 10
        run: |
          & "$PWD\test_integrity_logic.ps1"
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::存储完整性逻辑测试 rc=$LASTEXITCODE——见上面的 FAIL 行"
              exit 1
          }

      - name: Restic retention logic
        # restic 保留策略（forget --prune）的**逻辑+行为**那一半：从 backup.ps1 按哨兵标记切出
        # Invoke-ResticRetention，桩那一段钉 argv 逐字与 rc 三档，真 restic 那一段预置 9 份快照后
        # 要求「快照数真的按口径减少」+「仓库字节真的下降」。排在产品轮之前同前三步的口径：
        # 它只动临时目录，红了不该把同轮 25 分钟的产品结论带走。
        # **为什么这一步必须挂在 windows job 而不是只靠本地容器**：产品轮每轮新建空仓库，forget
        # 在那里一份快照都裁不掉——「没带 --prune」和「带了」在同一轮里长得一模一样，而它 standing
        # 的前提是「本地已 prune，云端 copy 只增不减」。bash 侧 10-02 用真 restic 量过那 4 KiB 与
        # 6 MiB 的差别（test_restic_retention.sh），ps1 侧此前只有静态守卫。
        # **这里比容器跑得更宽**：restic 已由 Install deps 进 PATH，所以场景4（真仓库、真快照、真
        # 回收）会执行；容器里没有 restic 时它整段 Skip。场景5 里 `.cmd` 桩那一支也只有在这台宿主
        # 上走得到（容器只走 `.sh`）。
        shell: pwsh
        timeout-minutes: 15
        run: |
          $env:PATH = "$env:RUNNER_TEMP\bin;$env:PATH"
          & "$PWD\test_retention_logic.ps1"
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::restic 保留策略逻辑测试 rc=$LASTEXITCODE——见上面的 FAIL 行"
              exit 1
          }

      - name: Status emit logic (A1)
        # STATUS.jsonl 产出器（Add-StatusLine，research/12 §5 的 A1 状态地基）的字段/顺序/
        # 隐私/编码面：从 backup.ps1 按 BEGIN-STATUS 哨兵切出，对着夹具 timeline 摆布状态位。
        # bash 侧的行为面由 linux job 的「E2E status line」覆盖；这一步管 ps1 侧自己的形状，
        # 以及 UTF-8 无 BOM 的字节判据（§11 续18/续19 的定案，5.1 与 pwsh 7 两档宿主同形才算数）
        shell: pwsh
        timeout-minutes: 10
        run: |
          $env:PATH = "$env:RUNNER_TEMP\bin;$env:PATH"
          & "$PWD\test_status_emit_logic.ps1"
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::STATUS 产出器逻辑测试 rc=$LASTEXITCODE——见上面的 FAIL 行"
              exit 1
          }

      - name: Permission surface logic
        # Windows 侧的权限面（roadmap ⑧，bash 侧那一课的 ps1 版本）：从 backup.ps1 按 BEGIN-PERMS/
        # END-PERMS 哨兵切出 Set-PrivateAcl，桩那一段钉「argv 逐字 = 树 /inheritance:r /grant:r
        # "*<SID>:(OI)(CI)F"」+ 非致命三档 + 返回流干净，调用点那一段钉两处（夜间轮 + 初始化向导，
        # 且排在读 secrets.env 之前）。
        # **为什么这一发不能只靠本地容器**：新目录从 %APPDATA%/%LOCALAPPDATA%/%USERPROFILE% 继承
        # DACL，而默认继承里带着 `BUILTIN\Users`——真机上同机别的账号读得到 restic 口令与 age 私钥。
        # 容器里没有 icacls，场景6（断开继承 + 子项靠**动态继承**跟着变）整段 Skip；那正是这条产品面
        # 成立与否的全部理由，所以下面还要有 5.1 那一档同名的一步。
        # 排在产品轮之前同前几步的口径：它只动临时目录里的桩，红了不该把同轮的产品结论带走。
        shell: pwsh
        timeout-minutes: 10
        run: |
          & "$PWD\test_perms_logic.ps1"
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::权限面逻辑测试 rc=$LASTEXITCODE——见上面的 FAIL 行"
              exit 1
          }

      - name: Recovery drill E2E (pwsh 7)
        # semantic.ps1 的恢复演练（roadmap A2b 的 Windows 那一半）端到端：真 restic 三类仓库 +
        # 真 age + 真 bg，跑完整 Invoke-SemanticLayer（密封 + 演练都在里面），再单独验节流、
        # 缺料分档、跨类别、内容哈希篡改、退化到只比大小的标注，以及红线 §1.1 的推送侧
        # （Push-TreeToCloud -ExcludeNames 真挡住 rescue-test.txt，对照组真推得上去）。
        # **为什么这一发必须存在**：Windows 侧此前根本没有演练——semantic.ps1 只密封就结束，
        # 所以「备份期记下源哈希」那一半即使做对了也仍是「记了没人用」。首轮（10-03 容器）它就
        # 当场抓出一个真 bug：`Invoke-Bg manifest … @($hashArgs)` 的带括号写法不是 splat，
        # 整份参数被拼成**一个** argv，bg 报 unrecognized arguments、密封进了一份空清单，
        # 而全链路看着「已密封」。
        # 排在 rescue / init-keys 之前：这是本轮新加的覆盖，免费 runner 上被砍掉的永远是队尾。
        shell: pwsh
        timeout-minutes: 25
        run: |
          $env:PATH = "$env:RUNNER_TEMP\bin;$env:PATH"
          & "$PWD\test_drill_e2e.ps1"
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::semantic.ps1 drill E2E rc=$LASTEXITCODE——见上面的 FAIL 行"
              exit 1
          }

      - name: Recovery drill E2E (Windows PowerShell 5.1)
        # 同一份守卫在真 5.1 宿主上再跑一遍，这一步不是复述 7.4 的结论：夹具读产物走
        # [IO.File]::ReadAllLines(UTF8) 而不是 5.1 的 Get-Content 默认码页（后者会把 rescue-test.txt
        # 里的中文打成乱码，于是**每一条中文断言恒假**）；`-Encoding utf8` 在 5.1 写 BOM；
        # 原生命令在 Stop 作用域写 stderr 会抛终止性异常。三处都是这一步才见过的。
        # 正文只能 ASCII（Actions 写这份临时 .ps1 不带 BOM，5.1 按控制台代码页读中文会变乱码）。
        shell: powershell
        timeout-minutes: 25
        run: |
          $env:PATH = "$env:RUNNER_TEMP\bin;$env:PATH"
          & "$PWD\test_drill_e2e.ps1"
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Windows PowerShell 5.1 cannot run drill E2E: rc=$LASTEXITCODE - see the FAIL lines above"
              exit 1
          }

      - name: Escape recovery E2E (pwsh 7)
        # rescue.ps1 的端到端：真 restic 仓库（本地布局 + 云端副本布局两种形状）+ 真 age 密封
        # 账本，24 个场景全走子进程（逃生工具的契约就是「独立文件、独立进程、只吃命令行」，
        # dot-source 测不到 argv 引号面与控制台编码面）。
        # **为什么放在产品轮之前**：同前三步逻辑测试的口径——它只动临时目录，红了不该把同轮
        # 40 分钟的产品断言带走；而它是这一轮新加的覆盖，免费 runner 上被砍掉的永远是队尾。
        # **为什么必须真装 age**：restic / age / age-keygen 任一不在 PATH，夹具就把真引擎那二十二段
        # （场景 3–24：账本两条解封路径、格式告警、旧形时间轴…）整段 Skip，而 Skip 不是通过——
        # rescue 的主判据恰恰是「密封清单解得开、解出来的取回路径真能取到文件」。
        # 判据只认 ASCII 契约行（`rescue: <事实>`）：5.1 读子进程 stdout 用的是控制台代码页，
        # 中文人读行会先被解码成 ? ——见 rescue.ps1 文件头与 test_rescue_e2e.ps1 场景 23。
        shell: pwsh
        timeout-minutes: 25
        run: |
          $env:PATH = "$env:RUNNER_TEMP\bin;$env:PATH"
          & "$PWD\test_rescue_e2e.ps1"
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::rescue.ps1 E2E rc=$LASTEXITCODE——见上面的 FAIL 行"
              exit 1
          }

      - name: Escape recovery E2E (Windows PowerShell 5.1)
        # 同一份守卫在**真实宿主**上再跑一遍：Task Scheduler 注册的 backup.ps1 走的是 powershell.exe
        # 5.1，而 5.1 与 7.4 在两处实测不同——原生命令在 Stop 作用域里往 stderr 写一行就抛终止性
        # 异常（probe_windows_ps51.ps1 事实 3）、函数内 exit 不跑外层 finally。这一步的解释器由
        # 测试自己选中（`$PSVersionTable.Major -lt 6` → 子进程也用 5.1），所以它是整条链路第一次
        # 在 5.1 上跑，不是把 7.4 的结论复述一遍。
        # 正文只能 ASCII（§2 编码那条：Actions 写这个临时 .ps1 不带 BOM，5.1 按控制台代码页读，
        # 中文会先变乱码——所以错误行照其它 5.1 步骤那样用英文）。
        shell: powershell
        timeout-minutes: 25
        run: |
          $env:PATH = "$env:RUNNER_TEMP\bin;$env:PATH"
          & "$PWD\test_rescue_e2e.ps1"
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Windows PowerShell 5.1 cannot run rescue E2E: rc=$LASTEXITCODE - see the FAIL lines above"
              exit 1
          }

      - name: Init-keys E2E (pwsh 7)
        # init-keys.ps1（Windows 密钥初始化）的端到端：Primary 档全非交互（age-keygen + age -R/-d -i），
        # Rescue 档要 age 在终端上索取 passphrase——那几段在 runner 上没有 expect，会整段打
        # `skip - …`，所以 **OK 之后还要看 skipped 那个数**（口径同 rescue E2E 那两步）。
        # 为什么值得单独挂一步：`semantic.ps1:212` 的密封只在 recipients.txt 存在时才跑，而 Windows
        # 侧此前没有任何东西生成它——也就是说 Windows 的时间轴从来没密封出过 manifest.json.enc，
        # 「逃生时只剩引擎一条路」是当时的实际状态。这一步把「生成得到、配对得上、恢复码解得开」
        # 钉成机器判据。
        # 判据只认 ASCII 契约行（`initkeys: <事实>`）：中文人读行在 5.1 的控制台代码页下会变 ?。
        shell: pwsh
        timeout-minutes: 25
        run: |
          $env:PATH = "$env:RUNNER_TEMP\bin;$env:PATH"
          & "$PWD\test_init_keys_e2e.ps1"
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::init-keys.ps1 E2E rc=$LASTEXITCODE——见上面的 FAIL 行"
              exit 1
          }

      - name: Init-keys E2E (Windows PowerShell 5.1)
        # 同一份守卫在真 5.1 宿主上再跑一遍：5.1 与 7.4 的差别在这一步里全是实打实的面——
        # `-Encoding utf8` 写 BOM（age 按字节读 recipients.txt 就废了）、静态
        # RandomNumberGenerator::Fill 不存在、原生命令在 Stop 作用域里写 stderr 就抛终止性异常。
        # 正文只能 ASCII（Actions 写这份临时 .ps1 不带 BOM，5.1 按控制台代码页读中文会变乱码）。
        shell: powershell
        timeout-minutes: 25
        run: |
          $env:PATH = "$env:RUNNER_TEMP\bin;$env:PATH"
          & "$PWD\test_init_keys_e2e.ps1"
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Windows PowerShell 5.1 cannot run init-keys E2E: rc=$LASTEXITCODE - see the FAIL lines above"
              exit 1
          }

      - name: Run backup and assert
        timeout-minutes: 40
        env:
          SKIP_WEBDAV: "1"
        run: |
          $env:PATH = "$env:RUNNER_TEMP\bin;$env:PATH"
          # 必须与 config.ps1 里的 $env:BACKUP_BASE 一致（config.ps1 用了 $env:RUNNER_TEMP\repos）
          # backup.ps1 会读取 $env:BACKUP_BASE 来决定 repo 路径
          $env:BACKUP_BASE = "$env:RUNNER_TEMP\repos"
          $logFile = "$env:RUNNER_TEMP\diag.txt"

          # 收集所有输出，最后一次性写入文件（避免追加管道破坏文件）
          $lines = @()
          $errLog = @()

          $lines += "=== start $(Get-Date -Format u) ==="

          # 调用 backup.ps1
          $code = 0
          try {
            $out = & "$PWD\backup.ps1" -Task Backup 2>&1
            $code = $LASTEXITCODE
            $out | ForEach-Object { $lines += $_ }
          } catch [System.Management.Automation.ExitException] {
            $code = $_.Exception.ExitCode
            $lines += "ExitException caught code=$code"
          } catch {
            $lines += "catch: $($_.Exception.Message)"
            $code = 1
          }
          $lines += "exit=$code"

          if ($code -ne 0) {
            # Write-Host 写 host stream，可被 GitHub Actions 捕获为注解，且不会提前终止 step
            Write-Host "::error::backup.ps1 failed with exit=$code"
            $lines += "ERROR backup failed code=$code"
            $lines | Out-File $logFile -Encoding utf8
            throw "backup.ps1 failed (exit $code)"
          }

          # 快照断言
          $secretsPath = "$env:APPDATA\PartiverseBackup\secrets.env"
          $lines += "ASSERT reading secrets from $secretsPath"
          if (-not (Test-Path $secretsPath)) {
            Write-Host "::error::secrets.env not found"
            $lines += "ERROR secrets missing"; $lines | Out-File $logFile -Encoding utf8; throw "secrets.env missing"
          }
          $secrets = Get-Content $secretsPath -Raw
          $lines += "ASSERT secrets length=$($secrets.Length)"
          $pass = [regex]::Match($secrets, "RESTIC_PASSWORD='(.+)'").Groups[1].Value
          if (-not $pass) {
            Write-Host "::error::password regex failed"
            $lines += "ERROR password parse failed"; $lines | Out-File $logFile -Encoding utf8; throw "password parse failed"
          }
          $lines += "ASSERT pass len=$($pass.Length)"
          $env:RESTIC_PASSWORD = $pass

          foreach ($cls in @("config", "files", "system")) {
            $repo = "$env:RUNNER_TEMP\repos\restic-$cls"
            $lines += "ASSERT $cls checking repo=$repo"
            if (-not (Test-Path $repo)) {
              Write-Host "::error::ASSERT $cls repo missing"
              $lines += "ERROR $cls repo missing"; $lines | Out-File $logFile -Encoding utf8; throw "$cls repo missing"
            }
            $files = @(Get-ChildItem $repo -Recurse -File -ErrorAction SilentlyContinue)
            $size  = if ($files.Count -gt 0) { ($files | Measure-Object Length -Sum).Sum } else { 0 }
            $lines += "ASSERT $cls : $($files.Count) files, $size bytes"
            if ($files.Count -lt 1 -or $size -lt 1) {
              Write-Host "::error::ASSERT $cls repo empty (files=$($files.Count) size=$size)"
              $lines += "ERROR $cls repo empty"; $lines | Out-File $logFile -Encoding utf8; throw "$cls repo empty"
            }
          }
          $lines += "=== ALL WINDOWS ASSERTIONS PASSED ==="
          $lines | Out-File $logFile -Encoding utf8
          Write-Host "=== ALL WINDOWS ASSERTIONS PASSED ==="

      - name: Assert semantic timeline
        shell: pwsh
        run: |
          # semantic.ps1 在 backup 内已执行；此处断言产物存在（windows runner 预装 python）
          # 已知弱守卫：-Recurse 找 MANIFEST.txt 对新旧两种形状都命中，所以 Windows 侧**没有**
          # 锁住形状。故意不加 PowerShell 断言——本机无 pwsh，写进去就是未经变异验证的守卫
          # （假绿比缺守卫更坏）；形状由 semantic 三平台的 demo 路径 + linux/macos 的
          # maxdepth 1 两处锁住。补这条的前提是 CI 里有能跑 pwsh 的验证位。
          $manifest = Get-ChildItem "$env:RUNNER_TEMP\repos\timeline" -Recurse -Filter "MANIFEST.txt" |
              Select-Object -First 1
          if (-not $manifest) { Write-Host "::error::timeline 无 MANIFEST.txt"; throw "no MANIFEST.txt" }
          Write-Host "--- $($manifest.FullName) ---"
          Get-Content $manifest.FullName

      - name: Assert drill report wiring (A2b)
        shell: pwsh
        run: |
          # 对位 linux/macos 的「Assert restore drill ran clean」（本文件 :151 / :374）。
          # 为什么逻辑守卫（test_drill_e2e.ps1，13 场景 / 容器 136 条断言，变异台账在文件头）不够：它再厚也测不到
          # 「产品轮真的调了 Invoke-Drill 并落了笔」——AGENTS §3 给 A2a 与权限面各补过一条
          # 运行时接线断言，就是同一条理由。
          # 判定顺序：先「产物在」→ 再「结论行成立」→ 最后「内容哈希这一维 n>0」。
          # 反过来的话「演练整段没跑」「跑了但结论行没写成」「跑通但只比大小」会撞成同一句报错。
          $root = Join-Path $env:RUNNER_TEMP "repos\timeline"
          $rt = Join-Path $root "rescue-test.txt"
          if (-not (Test-Path -LiteralPath $rt -PathType Leaf)) {
              Write-Host "::error::no rescue-test.txt at timeline root (drill never ran, or its path moved)"
              Get-ChildItem -LiteralPath $root -ErrorAction SilentlyContinue |
                  ForEach-Object { Write-Host "  $($_.Name)" }
              throw "missing rescue-test.txt"
          }
          # 5.1 的 Get-Content 默认码页会把中文打成乱码，于是每一条中文断言恒假（AGENTS §2）
          $rep = [System.IO.File]::ReadAllLines($rt, [System.Text.Encoding]::UTF8)
          $failLines = @($rep | Where-Object { $_ -match '^FAIL ' -or $_ -match '^RESULT: FAIL' })
          $results = @($rep | Where-Object { $_ -match '^RESULT: [0-9]+ PASS / [0-9]+ FAIL' })
          Write-Host "--- report tail ---"
          $rep | Select-Object -Last 12 | ForEach-Object { Write-Host $_ }
          if ($failLines.Count -ne 0) {
              Write-Host "::error::drill has failures: $($failLines -join ' | ')"
              throw "drill failures"
          }
          if ($results.Count -ne 1) {
              Write-Host "::error::expected exactly one RESULT line, found $($results.Count)"
              throw "bad RESULT line count"
          }
          # 结论行形状（semantic.ps1:316）：
          #   RESULT: <pass> PASS / <fail> FAIL（抽样 <s>；内容哈希 <h>，仅比大小 <n>）
          # 取数字用 ASCII 正则而不是匹配中文标签：正文里的中文在 shell: powershell 那档会先过
          # 控制台代码页（AGENTS §2），这一步只认顺序——五个数按 pass/fail/samples/hashed/sizeOnly 排。
          $nums = @([regex]::Matches($results[0], '\d+') | ForEach-Object { [int]$_.Value })
          if ($nums.Count -lt 5) {
              Write-Host "::error::RESULT line carries $($nums.Count) numbers, expected 5 (pass/fail/samples/hashed/sizeOnly): $($results[0])"
              throw "RESULT line shape changed"
          }
          if ($nums[0] -lt 1) { Write-Host "::error::zero PASS samples: $($results[0])"; throw "no PASS" }
          if ($nums[1] -ne 0) { Write-Host "::error::FAIL count is $($nums[1]): $($results[0])"; throw "FAIL count nonzero" }
          # 最后这一维才是 A2b 在 Windows 上的全部意义：只比大小的演练看不见「同长度不同内容」，
          # 而容器 lane 恒证不到盘符路径那支（test_drill_e2e.ps1 头部「不覆盖」登记的第一支）。
          # hashed==0 而 samples>0 意味着备份期那次 --hash-drill-samples 一个都没记上——
          # 「记了没人用」在产物上长得跟「这层证据存在」一模一样，所以它值得单独判红。
          if ($nums[3] -lt 1) {
              Write-Host "::error::drill compared sizes only: hashed=$($nums[3]) of samples=$($nums[2]) (source sha256 never recorded)"
              throw "content-hash dimension degenerated"
          }
          Write-Host "drill wiring OK: pass=$($nums[0]) hashed=$($nums[3]) sizeOnly=$($nums[4])"

      # 红线 §1.4 在 PowerShell 侧的同一条（bash 侧由 test_cloud_failure.sh 锁）：云端推送失败
      # 必须非零退出并告警，不得宣布 FULLY COMPLETE。整条 Windows 路径此前缺这一发——rclone
      # 失败只 Write-Warning，结论照打 COMPLETE。这里指向一个不存在的 remote 让推送当场失败
      # （不碰网盘、不依赖网络），断言顺序照 §3 的规矩：**先证明确实尝试过推送、再问「哪条检查
      # 抓到了它」、最后才是退出码**——反过来的话「整轮崩在别处」和「守卫没生效」会撞成同一句报错。
      - name: Assert cloud push failure is visible
        timeout-minutes: 20
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $env:PATH = "$env:RUNNER_TEMP\bin;$env:PATH"
          $env:BACKUP_BASE = "$env:RUNNER_TEMP\repos"
          $env:BACKUP_TARGETS = "nosuchremote:backguard-ci"
          # 必须是**子进程**：PowerShell 里脚本内的 `exit` 会终结整个宿主会话，用 & 直调产品
          # 脚本的话产品一 exit 本 step 就跟着死——「判红」与「没断言」撞成同一件事，正好把这条
          # 守卫自己变成假绿。解释器用 pwsh.exe（与本 job 的 shell: pwsh 同一个），因为
          # powershell.exe 5.1 在 $ErrorActionPreference=Stop 下会把原生命令的 stderr 重定向
          # （restic … 2>&1 | Tee-Object、rclone mkdir … 2>$null）变成终止性异常。那一发**已由
          # 本 job 末尾的「Backup round on Windows PowerShell 5.1」单独处理**（10-02 实测三形全
          # THREW，产品侧的每个含原生命令作用域自己压回 Continue）；这条守卫只管红线 §1.4，两种
          # 坏法混在一步里就分不出「云端没推上去」和「宿主语义炸了」。
          $out = & pwsh.exe -NoProfile -ExecutionPolicy Bypass -File "$PWD\backup.ps1" -Task Backup 2>&1
          $code = $LASTEXITCODE
          $text = $out | Out-String
          $rlog = "$env:LOCALAPPDATA\PartiverseBackup\logs\rclone.log"
          if (-not (Select-String -Path $rlog -Pattern "nosuchremote" -Quiet -ErrorAction SilentlyContinue)) {
            Write-Host "::error::rclone.log 里没有 nosuchremote 这条 remote——这一轮根本没尝试推送，下面三条断言全是空转"
            exit 1
          }
          if ($text -notmatch 'cloud=[1-9]') {
            Write-Host "::error::推送失败没进结论行（没有 cloud=<非零>），实得 rc=$code"
            Write-Host "--- 输出尾部 ---"
            Write-Host (($out | Select-Object -Last 25) -join "`n")
            exit 1
          }
          if ($text -match 'FULLY COMPLETE') {
            Write-Host "::error::云端一个对象都没推上去，却宣布 FULLY COMPLETE（红线 §1.4）"
            exit 1
          }
          if ($code -eq 0) {
            Write-Host "::error::推送失败仍退出 0：上层拿不到非零就等于「成功」"
            exit 1
          }
          Write-Host "=== 云端失败可见性 OK (rc=$code) ==="
          # 必须显式 exit 0：pwsh -Command 在没有 exit 语句时把**最后一条原生命令的退出码**
          # 当作宿主退出码（8eddf05 那轮实测：四条断言全过、打了 OK 行，step 仍 rc=1，因为
          # $code 就是被测产品该有的 1）。不写这行，「产品按红线判崩」会直接把本 step 判崩——
          # 守卫永远只可能红，等于没有守卫。
          exit 0

      # Windows 侧本地暂存保留策略（semantic.ps1 的 Prune-LocalTimeline，与 semantic.sh 的
      # prune_local_timeline 同一条口径）。此前 Windows 只有 run JSON 留档有保留上限，时间轴根
      # 越长越厚——本地暂存的意义是「云端丢了能重建」，不是无限历史。
      #
      # 分成两段是 10-02 首轮 CI 教出来的：那一轮报「KEEP=1 却一份都没裁」，可「保留逻辑坏了」与
      # 「保留逻辑根本没被调用」（语义层在 generate 之前就 return 了，或函数内抛了终止性异常被
      # backup.ps1 的 catch 降成 warning）在产物目录上长得一模一样，只跑产品链路分辨不出来。
      # 第一段 dot-source semantic.ps1 只调函数本身（该文件全是函数定义、无顶层副作用），先把
      # 「逻辑」单独证掉；第二段才跑整轮，谈「接线」。两段的失败面不重叠。
      # KEEP=1 把裁剪压成确定形状：3 个按当天回推的种子 + 1 个形态不合规的目录，跑完之后必须只剩
      # 「窗口内那份 + 不合规那份」，且被裁快照腾空的日期壳一并消失。断言顺序照 §3：先证本轮真跑完
      # （否则整轮崩在别处会伪装成「保留策略坏了」）、再读函数自己打的窗口证据行、最后才是退出码；
      # 成功路径显式 exit 0（上一条守卫实测的坑：pwsh 在没有 exit 语句时拿最后一条原生命令的 rc
      # 当宿主 rc）。
      - name: Assert local timeline retention
        timeout-minutes: 25
        shell: pwsh
        env:
          SKIP_WEBDAV: "1"
        run: |
          $ErrorActionPreference = "Continue"
          $env:PATH = "$env:RUNNER_TEMP\bin;$env:PATH"
          $env:BACKUP_BASE = "$env:RUNNER_TEMP\repos"
          $env:SEM_TIMELINE_KEEP = "1"
          $stage = "$env:BACKUP_BASE\timeline"

          # 探针（10-02 集成段「generate 失败」的定位器）：restic 的 time 字段经 ConvertFrom-Json
          # 交回什么类型是**宿主版本相关**的——pwsh 7.2 给 String、pwsh 7.4+/Windows PowerShell 5.1
          # 给 [datetime]，后者拼进命令行就是文化格式的 `10/02/2026 06:31:11`，bg 在 generate 才崩。
          # 这一行把「这台宿主到底是哪种」写进日志，不再靠猜（详见 semantic.ps1 的 Format-IsoTime）。
          $tp = @('[{"time":"2026-10-02T06:31:11.447503458+00:00"}]' | ConvertFrom-Json)[0].time
          Write-Host "probe: pwsh=$($PSVersionTable.PSVersion) jsonTimeType=$($tp.GetType().Name) interp=`"$tp`""

          # 先把 stage 清空：上游两步（首轮 backup、云端失败守卫）各留了一份真快照，不清掉的话
          # 「窗口里该剩哪几份」取决于上游跑了几轮，断言就不是确定形状了。这是 runner 的一次性
          # 临时目录，且本步是 windows job 最后一个断言步，被删的产物没有下游读者。
          if (Test-Path -LiteralPath $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
          [void][System.IO.Directory]::CreateDirectory($stage)

          # 快照 = stage 根下第 4 层（YYYY/MM/DD/HHMM-标签），与 bash 的 -mindepth 4 -maxdepth 4 同口径
          function Get-SnapDirs {
              param([string]$Root)
              $n = $Root.Length
              @(Get-ChildItem -LiteralPath $Root -Recurse -Directory -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName.Length -gt $n -and
                      (($_.FullName.Substring($n).TrimStart('\', '/') -split '[\\/]').Count) -eq 4 })
          }
          function Seed-Snap {
              param([datetime]$When, [string]$Leaf = '0900-seed')
              $rel = 'timeline/' + $When.ToString('yyyy/MM/dd') + '/' + $Leaf
              $p = Join-Path $env:BACKUP_BASE ($rel -replace '/', '\')
              # 用 .NET 直接建整棵树：New-Item -Force 对「多级父目录不存在」的行为在 5.1/7 之间
              # 不一致，种子铺不全的话后面每一句都会假绿
              [void][System.IO.Directory]::CreateDirectory($p)
              'seed' | Out-File (Join-Path $p 'marker.txt')
              $p
          }
          # 种子日期按当天回推，别写死年份：runner 时钟走到 2027 年这些目录就变成「未来快照」，
          # 排序时留在最后，断言当场变成随机红
          $dNew = (Get-Date).AddDays(-60)
          $dMid = (Get-Date).AddDays(-120)
          $dOld = (Get-Date).AddDays(-180)
          $dBad = (Get-Date).AddDays(-61)   # 与 dNew 同月：级联时该月的壳不许被收走
          $dFar = (Get-Date).AddDays(-400)  # 跨年：它被裁之后年/月/日三层壳都该一起消失

          # ---------- 第一段：只调函数本身 ----------
          . "$PWD\semantic\semantic.ps1"
          $pNew = Seed-Snap $dNew
          $pMid = Seed-Snap $dMid
          $pOld = Seed-Snap $dOld
          $pBad = Seed-Snap $dBad 'notes'   # 叶子不合规：白名单必须让它活着
          $pFar = Seed-Snap $dFar
          $uBefore = @(Get-SnapDirs $stage)
          if ($uBefore.Count -ne 5) {
              Write-Host "::error::第一段种子没铺齐（第 4 层 $($uBefore.Count) 个，该 5 个），后面全是空转"
              exit 1
          }
          Prune-LocalTimeline -Stage $stage
          if (Test-Path -LiteralPath $pOld) {
              Write-Host "::error::第一段：最旧的快照没删（$pOld 还在）——窗口或排序本身没生效"
              exit 1
          }
          if (Test-Path -LiteralPath $pMid) {
              Write-Host "::error::第一段：第二旧的快照没删（$pMid 还在）"
              exit 1
          }
          if (Test-Path -LiteralPath $pFar) {
              Write-Host "::error::第一段：跨年的快照没删（$pFar 还在）"
              exit 1
          }
          if (-not (Test-Path -LiteralPath $pNew)) {
              Write-Host "::error::第一段：窗口内的最新快照被删了——保留的是「除最后 N 份外」，删过头"
              exit 1
          }
          if (-not (Test-Path -LiteralPath (Join-Path $pBad 'marker.txt'))) {
              Write-Host "::error::第一段：形态不合规的目录连内容一起没了——叶子白名单没起作用"
              exit 1
          }
          foreach ($gone in @($pOld, $pMid, $pFar)) {
              $shell = Split-Path $gone -Parent          # YYYY/MM/DD
              if (Test-Path -LiteralPath $shell) {
                  Write-Host "::error::第一段：快照裁了但日期壳还在（$shell）——空壳级联那段没跑"
                  exit 1
              }
          }
          # 级联必须**一路收到年**：先筛空再统一删的写法只会收掉日期这一层，月份壳照旧留着——
          # 10-02 在 Linux 容器里跑 pwsh（test_prune_logic.ps1）才抓出这一发移植偏差，
          # bash 侧同一条口径也由 test_timeline_retention.sh 的 2b 段钉住
          $farDay = Split-Path $pFar -Parent
          $farMon = Split-Path $farDay -Parent
          $farYear = Split-Path $farMon -Parent
          if (Test-Path -LiteralPath $farMon) {
              Write-Host "::error::第一段：月份壳还在（$farMon）——级联只走了一层"
              exit 1
          }
          if (Test-Path -LiteralPath $farYear) {
              Write-Host "::error::第一段：年壳还在（$farYear）——级联没有自深向浅收到顶"
              exit 1
          }
          Write-Host "=== 第一段（函数本身）OK：裁三份、留一份、不合规那份活着、空壳收到年 ==="

          # ---------- 第二段：整条产品链路（backup.ps1 作子进程）----------
          # 重新铺被第一段裁掉的种子：这一步之后「旧快照消失」只能由本轮产品完成。
          # 此刻 stage 里是 4 个第 4 层目录（dNew、dMid、dOld、notes），产品那轮再加 1 份真快照。
          [void](Seed-Snap $dMid)
          [void](Seed-Snap $dOld)
          [void](Seed-Snap $dBad 'notes')
          [void](Seed-Snap $dFar)
          $before = @(Get-SnapDirs $stage)
          if ($before.Count -ne 5) {
              Write-Host "::error::第二段种子没铺齐（第 4 层 $($before.Count) 个，该 5 个）"
              exit 1
          }

          # bg 的 stderr 全进子进程的 backup.log（非致命层不把 traceback 往 stdout 甩），
          # 所以「generate 为什么失败」只有那儿有答案。CI 是合成夹具（路径都是 RUNNER_TEMP 下的
          # 桩数据），尾部 12 行打进作业日志不触碰明文层红线。
          function Show-ChildLog {
              $p = "$env:LOCALAPPDATA\PartiverseBackup\logs\backup.log"
              Write-Host "--- 子进程 backup.log 末尾 12 行 ---"
              if (Test-Path -LiteralPath $p) {
                  Write-Host ((Get-Content -LiteralPath $p -Tail 12 -ErrorAction SilentlyContinue) -join "`n")
              } else { Write-Host "(没有 $p——子进程没写过日志？)" }
          }

          # 必须是**子进程**：脚本内的 exit 会终结整个宿主会话（同上一条守卫的理由）。
          $out = & pwsh.exe -NoProfile -ExecutionPolicy Bypass -File "$PWD\backup.ps1" -Task Backup 2>&1
          $code = $LASTEXITCODE
          $text = $out | Out-String
          # 这一段是盲写的 PowerShell（本机无 pwsh），失败时全靠子进程这几行分清四种坏法：
          # 没被调用 / keep 没读到 / 第 4 层没认出 / 函数内抛异常
          $sem = @($out | Where-Object { "$_" -match 'semantic' } | Select-Object -First 20)
          Write-Host "--- 子进程 [semantic] 行（$($sem.Count) 条）---"
          Write-Host ($sem -join "`n")
          Write-Host "--- 子进程末尾 15 行 ---"
          Write-Host ((@($out | Select-Object -Last 15)) -join "`n")

          if ($text -notmatch 'FULLY COMPLETE') {
              Write-Host "::error::这一轮没跑到 FULLY COMPLETE，保留策略的判定无从谈起"
              Show-ChildLog
              exit 1
          }
          # 窗口证据行：一行三个事实（函数被调用过 / keep 读到了 / 第 4 层认出几个）。
          # 匹配串是纯 ASCII，为的就是不过 [Console]::OutputEncoding 那道解码——中文一旦糊成
          # 乱码，这条守卫会红得毫无道理。
          $ev = @($out | Where-Object { "$_" -match 'timeline-retention window' } | Select-Object -First 1)
          if ($ev.Count -eq 0) {
              Write-Host "::error::子进程没打窗口证据行 → Prune-LocalTimeline 根本没被调用（语义层在 generate 之前就返回了）。第一段已证明函数本身正确。"
              Show-ChildLog
              exit 1
          }
          $seenKeep = -1; $seenSnaps = -1
          if ("$($ev[0])" -match 'keep=(\d+) snaps=(\d+)') {
              $seenKeep = [int]$Matches[1]; $seenSnaps = [int]$Matches[2]
          } else {
              Write-Host "::error::窗口证据行形状不合（实得: $($ev[0])）"
              Show-ChildLog
              exit 1
          }
          if ($seenKeep -ne 1) {
              Write-Host "::error::产品没读到 SEM_TIMELINE_KEEP（keep=$seenKeep，该 1）——环境变量没传进子进程，或默认窗口撑过了快照数"
              Show-ChildLog
              exit 1
          }
          if ($seenSnaps -ne 6) {
              Write-Host "::error::产品只认出 $seenSnaps 个第 4 层快照（该 6：5 份种子 + 本轮 1 份真快照）——深度判定与守卫不同形"
              Show-ChildLog
              exit 1
          }
          $after = @(Get-SnapDirs $stage)
          $leaves = @($after | ForEach-Object { $_.Name })
          if ((Test-Path -LiteralPath $pMid) -or (Test-Path -LiteralPath $pOld) -or (Test-Path -LiteralPath $pFar)) {
              Write-Host "::error::种子没被裁掉（$pMid / $pOld / $pFar 至少一份还在），而证据行说看到了 $seenSnaps 个——认得出却删不掉"
              exit 1
          }
          if ($leaves -notcontains 'notes') {
              Write-Host "::error::形态不合规的目录被删了（叶子白名单没起作用），剩 $($leaves -join ', ')"
              exit 1
          }
          if (-not (Test-Path -LiteralPath (Join-Path $pBad 'marker.txt'))) {
              Write-Host "::error::不合规目录里的文件也没了——连内容一起消失说明删的是路径而不是判定"
              exit 1
          }
          $kept = @($leaves | Where-Object { $_ -match '^[0-9]{4}-[a-z0-9-]+$' })
          if ($kept.Count -ne 1) {
              Write-Host "::error::合规快照该只剩 1 份（KEEP=1），实剩 $($kept.Count) 份：$($kept -join ', ')"
              exit 1
          }
          $seedShell = Split-Path $pOld -Parent
          if (Test-Path -LiteralPath $seedShell) {
              Write-Host "::error::快照裁了但日期壳还在（$seedShell）——空壳级联那段没跑"
              exit 1
          }
          if (Test-Path -LiteralPath $farYear) {
              Write-Host "::error::产品那轮的跨年壳还在（$farYear）——级联只走了一层（第一段已过，这是接线差异）"
              exit 1
          }
          if ($code -ne 0) {
              Write-Host "::error::保留策略都对了，退出码却不是 0（$code）——结论行与判定脱节"
              exit 1
          }
          Write-Host "=== 第二段（产品链路）OK：keep=$seenKeep snaps=$seenSnaps、合规剩 $($kept.Count) 份、不合规那份在、日期壳已收 ==="
          exit 0

      - name: Assert log rotation and run boundary wiring
        # 逻辑测试测不到「调用点接上了没有」：函数在文件里、哨兵也成对，但没人调用它，
        # 产物上长得一模一样（与保留策略那发同样的两件事，见上一条守卫的分段说明）。
        # 所以这一步预置**超限的现役日志 + 6 份历史副本 + 两种必须放过的路径**，再跑一发
        # 真产品轮，验 backup.ps1 里那两处接线与脚本末尾的边界行落点。
        # 必须走**子进程**（与云端失败可见性那条同一理由：脚本内的 `exit` 会带走宿主），
        # 解释器同样用 pwsh.exe（5.1 那一档另有一步）。排在既有产品断言之后：它自己也要跑
        # 一整轮，红的话不该把前面已经拿到的结论一起带走。
        shell: pwsh
        timeout-minutes: 20
        env:
          SKIP_WEBDAV: "1"
        run: |
          $ErrorActionPreference = "Continue"
          $env:PATH = "$env:RUNNER_TEMP\bin;$env:PATH"
          $env:BACKUP_BASE = "$env:RUNNER_TEMP\repos"
          # 阈值压到 2 KiB、窗口压到 3：真机上 4 MiB / 7 份在 CI 里永远够不着，
          # 「低频路径的节流本身要被测」是同一口径（见 AGENTS §2 完整性那条）
          $env:SEM_LOG_MAX_BYTES = '2048'
          $env:SEM_LOG_KEEP = '3'
          $logs = "$env:LOCALAPPDATA\PartiverseBackup\logs"
          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          $log = Join-Path $logs 'backup.log'
          # 上一轮的噪音：本轮该把它整份搬进副本，现役日志里一个字都不许留
          ('PRE-EXISTING-NOISE ' * 300) | Set-Content -LiteralPath $log -Encoding ascii
          $seeded = @()
          for ($i = 1; $i -le 6; $i++) {
              $n = 'backup.log.{0}-{1}' -f (Get-Date).AddDays(-400 - $i).ToString('yyyyMMdd'), '023400'
              $p = Join-Path $logs $n
              'x' * 10 | Set-Content -LiteralPath $p -Encoding ascii
              # mtime 逐个写死（同秒并列会让「留哪几份」变成运气），且必须都早于本轮
              (Get-Item -LiteralPath $p).LastWriteTime = (Get-Date).AddDays(-400 - $i)
              $seeded += $p
          }
          $keepme = Join-Path $logs 'backup.log.keepme'
          'not-a-rotation-copy' | Set-Content -LiteralPath $keepme -Encoding ascii
          $dirOld = Join-Path $logs ('backup.log.' + (Get-Date).AddDays(-500).ToString('yyyyMMdd-HHmmss'))
          [void][System.IO.Directory]::CreateDirectory($dirOld)
          'marker' | Set-Content -LiteralPath (Join-Path $dirOld 'marker.txt') -Encoding ascii
          (Get-Item -LiteralPath $dirOld).LastWriteTime = (Get-Date).AddDays(-500)

          $out = & pwsh.exe -NoProfile -ExecutionPolicy Bypass -File "$PWD\backup.ps1" -Task Backup 2>&1
          $code = $LASTEXITCODE
          $text = $out | Out-String
          if ($code -ne 0) {
              Write-Host "::error::预置完日志后这一轮产品脚本没跑成（rc=$code）——下面的接线断言全是空转"
              Write-Host (($out | Select-Object -Last 25) -join "`n")
              exit 1
          }
          $now = @(Get-Content -LiteralPath $log -Raw -ErrorAction SilentlyContinue) -join "`n"
          # 先证「切走了」，再证「新的落进现役日志」：反过来的话，整轮崩在别处也会让第二条绿
          if ($now -match 'PRE-EXISTING-NOISE') {
              Write-Host "::error::超限的现役日志没被切走，历史噪音还留在现役日志里——调用点没接上或阈值没读到"
              exit 1
          }
          if ($now -notmatch 'run boundary: sha=') {
              Write-Host "::error::现役日志里没有 run 边界行——脚本末尾那个落点没执行（pwsh 7 上函数内裸 exit 不触发 finally，这正是不用 finally 的理由）"
              exit 1
          }
          $bl = @($now -split "`n" | Where-Object { $_ -match 'run boundary: sha=' })
          if ($bl.Count -ne 1) {
              Write-Host "::error::一轮该只有一行边界行，实得 $($bl.Count) 行：$($bl -join ' | ')"
              exit 1
          }
          if ($bl[0] -notmatch 'rc=0 dur=\d+s') {
              Write-Host "::error::这一轮 FULLY COMPLETE，边界行却记的不是 rc=0：$($bl[0])"
              exit 1
          }
          $copies = @(Get-ChildItem -LiteralPath $logs -Force -File |
              Where-Object { $_.Name -match '^backup\.log\.[0-9]{8}-[0-9]{6}$' })
          if ($copies.Count -ne 3) {
              Write-Host "::error::SEM_LOG_KEEP=3 没封顶住：轮转副本 $($copies.Count) 份（$($copies.Name -join ', ')）"
              exit 1
          }
          # 噪音不是「没了」而是「搬进了副本」：按内容找到那份副本，比按日期前缀猜名字可靠
          # （跨午夜跑 CI 时日期前缀那条判定会自己失效）
          $withNoise = @($copies | Where-Object { (Get-Content -LiteralPath $_.FullName -Raw) -match 'PRE-EXISTING-NOISE' })
          if ($withNoise.Count -ne 1) {
              Write-Host "::error::现役日志里的历史噪音既不在现役日志、也没有恰好一份副本带着它（找到 $($withNoise.Count) 份）——切走 = 搬家，不是截断"
              exit 1
          }
          # 两道删除守卫在真 Windows 文件系统上也得各自站住（大小写不敏感 + 反斜杠路径是
          # 容器里造不出来的那一档，所以才要在这里重跑一遍而不是只信逻辑测试）
          if (-not (Test-Path -LiteralPath $keepme)) {
              Write-Host "::error::形态白名单没守住：非轮转形态的 $keepme 被删了"
              exit 1
          }
          if (-not (Test-Path -LiteralPath (Join-Path $dirOld 'marker.txt'))) {
              Write-Host "::error::同名合规**目录**连内容一起被删了（$dirOld）——「必须是普通文件」那道守卫没起作用"
              exit 1
          }
          if (-not (Test-Path -LiteralPath $keepme)) {
              Write-Host "::error::形态白名单没守住：backup.log.keepme 被删了"
              exit 1
          }
          if (-not (Test-Path -LiteralPath (Join-Path $dirOld 'marker.txt'))) {
              Write-Host "::error::同名合规**目录**被当成超额副本处理了（目录里的内容都没了）"
              exit 1
          }
          Write-Host "=== A4 接线 OK：现役日志已切走、边界行一行 rc=0、副本封顶 3 份、两道守卫各放过各自那种 ==="
          exit 0

      - name: Assert integrity report wiring (A2a)
        # 逻辑测试的场景11 只能证「调用点在源码里」，证不了「这一轮真的产出过报告」——
        # 函数在、哨兵成对、静态断言全绿，而运行时因为一条环境变量、一次异常或一个不满足的
        # 前置条件从未落笔，产物上与前一种长得一模一样（与保留策略/日志轮转那两发同一课）。
        # 所以这一步直接读**上面那轮产品备份**留下的 timeline\INTEGRITY.txt：checks 必须
        # 真大于 0（空登记还落笔是最坏的那种报告）、真 restic 的判定必须落在档位上、
        # 而上云的明文里不许有仓库绝对路径（红线 §1.1 对机器报告的口径）。
        # 再跑一发**窗口未到期**的产品轮，验节流在真实文件系统上站住：报告 mtime 不许变、
        # 整轮退出码不许被「没到期」影响——月度路径没被跑过两次，「月度」只是形容词。
        # 排在既有产品断言之后：它自己也要跑一整轮，红了不该把前面已拿到的结论带走。
        shell: pwsh
        timeout-minutes: 20
        env:
          SKIP_WEBDAV: "1"
        run: |
          $ErrorActionPreference = "Continue"
          $env:PATH = "$env:RUNNER_TEMP\bin;$env:PATH"
          $env:BACKUP_BASE = "$env:RUNNER_TEMP\repos"
          $rep = Join-Path $env:BACKUP_BASE 'timeline\INTEGRITY.txt'
          if (-not (Test-Path -LiteralPath $rep -PathType Leaf)) {
              Write-Host "::error::上面那轮产品备份没产出 timeline\INTEGRITY.txt——调用点在这台宿主上一次都没执行（逻辑测试的静态断言咬不住这种坏法）"
              exit 1
          }
          $text = Get-Content -Raw -LiteralPath $rep
          $sum = [regex]::Match($text, 'checks=(\d+) FAIL=(\d+) UNKNOWN=(\d+)')
          if (-not $sum.Success) {
              Write-Host "::error::报告里没有汇总计数行——读的人没法判断这轮到底校验了几个仓库`n$text"
              exit 1
          }
          if ([int]$sum.Groups[1].Value -lt 1) {
              Write-Host "::error::报告写了 checks=0 的「完整性通过」，比没有报告更坏（空登记就不该落笔）"
              exit 1
          }
          if ([int]$sum.Groups[2].Value -gt 0) {
              Write-Host "::error::真 restic 在 CI 新建的小仓库上判了 FAIL——要么仓库真腐化了，要么判定档位写错`n$text"
              exit 1
          }
          if ($text -notmatch "(?m)^PASS\s+restic:") {
              Write-Host "::error::没有一条 PASS 行，却写了 checks=$($sum.Groups[1].Value)：判定归口没接上`n$text"
              exit 1
          }
          # 隐私面：报告随时间轴上云，仓库绝对路径（含备份根目录本身）一个字节都不许抄进去。
          # 两种分隔符都查——只查一种等于给「换个写法把路径抄进明文」留门。
          foreach ($form in @($env:RUNNER_TEMP, $env:RUNNER_TEMP.Replace('\', '/'))) {
              if ($text -match [regex]::Escape($form)) {
                  Write-Host "::error::报告里出现了运行器临时目录路径（$form）——引擎原文漏进了上云明文"
                  exit 1
              }
          }
          $before = (Get-Item -LiteralPath $rep).LastWriteTime
          $out = & pwsh.exe -NoProfile -ExecutionPolicy Bypass -File "$PWD\backup.ps1" -Task Backup 2>&1
          $code = $LASTEXITCODE
          $text2 = $out | Out-String
          if ($code -ne 0) {
              Write-Host "::error::窗口未到期的这一轮产品脚本没跑成（rc=$code）——下面的节流断言全是空转"
              Write-Host (($out | Select-Object -Last 25) -join "`n")
              exit 1
          }
          if ($text2 -notmatch '未到校验窗口') {
              Write-Host "::error::刚写过的报告没挡住第二次整仓读取——每晚把仓库读一遍，月度变成了日度`n$(($out | Select-Object -Last 15) -join "`n")"
              exit 1
          }
          if ((Get-Item -LiteralPath $rep).LastWriteTime -ne $before) {
              Write-Host "::error::未到期的这一轮仍然重写了报告——用 mtime 当窗口标记这套机制没生效"
              exit 1
          }
          Write-Host "=== A2a 接线 OK：产品轮产出 checks=$($sum.Groups[1].Value) 的报告、无路径漏泄、第二发被窗口挡在门外 ==="
          exit 0

      - name: Assert permission surface wiring
        # 逻辑测试（上面那两步）无论多少条静态断言都证不了「这一轮真的收紧了」——A2a 那一课
        # （`Assert integrity report wiring`）的同形欠账，所以这一发读**上面那轮产品备份**留下的
        # 真目录：$env:APPDATA\PartiverseBackup（config.ps1 + secrets.env 住的地方）、
        # $env:LOCALAPPDATA\PartiverseBackup\logs、$env:RUNNER_TEMP\repos（产品轮按 BACKUP_BASE 建）。
        # **判据取 `AreAccessRulesProtected` 而不是「有没有 BUILTIN\Users」**：后者在这条 runner 上
        # 可能是镜像默认 DACL 本来就干净（真机上 %APPDATA% 的继承里带着 Users，CI 的临时账号不一定），
        # 拿它当唯一信号会是一条**恒真的死断言**——摘掉调用点照样绿。「根被断开继承」这件事只有
        # Set-PrivateAcl 那一次调用能产出，而它正是「子项靠动态继承跟着变」的前提。
        # 顺带仍查「除许可名单外没有别的 ACE」与「根上仍有自己」（把自己挡在外面＝下一轮直接失败）。
        # 比较全部落在 **SID** 上：Get-Acl 交回的 IdentityReference 在 Windows 上通常已翻成账号名，
        # 拿名字比 WindowsIdentity 的 SID 会把「自己」也算成外人（一条只有 runner 才露头的假失败）。
        # 排在既有产品断言之后、5.1 那几步之前：它依赖产品轮的产物，自己几秒收敛。
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Continue'
          $self = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $allow = @($self, 'S-1-5-18', 'S-1-5-32-544')
          function SidOf($ref) {
              if ($ref -is [System.Security.Principal.SecurityIdentifier]) { return $ref.Value }
              try { return $ref.Translate([System.Security.Principal.SecurityIdentifier]).Value } catch { return $ref.Value }
          }
          $trees = @("$env:APPDATA\PartiverseBackup",
                     "$env:LOCALAPPDATA\PartiverseBackup\logs",
                     "$env:RUNNER_TEMP\repos")
          $bad = @()
          $shown = @()
          foreach ($t in $trees) {
              if (-not (Test-Path -LiteralPath $t)) { $bad += "tree missing: $t"; continue }
              $acl = Get-Acl -LiteralPath $t
              $sids = @($acl.Access | ForEach-Object { SidOf $_.IdentityReference })
              if (-not $acl.AreAccessRulesProtected) { $bad += "still inherits, Set-PrivateAcl did not run on it: $t" }
              $foreign = @($sids | Where-Object { $allow -notcontains $_ })
              if ($foreign.Count -gt 0) { $bad += "ACE outside allowlist on ${t}: $($foreign -join ',')" }
              if ($sids -notcontains $self) { $bad += "no ACE for self on $t (next round cannot write here)" }
              $shown += "$t protected=$($acl.AreAccessRulesProtected) ace=$($sids.Count)"
          }
          if ($bad.Count -gt 0) {
              Write-Host "::error::permission surface wiring check failed"
              $bad | ForEach-Object { Write-Host "::error::$_" }
              $shown | ForEach-Object { Write-Host $_ }
              exit 1
          }
          $shown | ForEach-Object { Write-Host $_ }
          Write-Host "=== permission surface wiring OK: 3 trees inheritance-closed, self-only (allowlist: self + SYSTEM + Administrators) ==="

      - name: Windows PowerShell 5.1 host probe
        # AGENTS §5 的「`backup.ps1` 顶部 `$ErrorActionPreference = "Stop"` 是在 powershell.exe
        # 5.1 下的未验证面」——Task Scheduler 注册的正是这台宿主，而本 job 其余步骤的 shell 都是
        # pwsh 7。GitHub 的 `shell: powershell` 直接把 step 交给 Windows PowerShell 执行，于是
        # 「能不能解析 / BOM 在不在 / JSON 交回什么类型 / stderr 会不会变成终止性异常」几件事
        # 第一次有一手事实，而不是从 7.x 的行为外推。
        # **正文必须纯 ASCII（10-02 实测）**：Actions 把 run 正文写成临时 .ps1 时不带 BOM，5.1
        # 于是按 ANSI(CP1252) 解码；中文注释的 UTF-8 字节里 0x91-0x94 正是弯引号，而 PowerShell
        # 把弯引号当字符串定界符——一个没闭合的字符串吃掉后面的 `}`，整步炸在
        # `Missing closing '}'`（run 36991285809 的 windows job 就是这么死的，探针自己带着中文
        # 注释，于是「产品 .ps1 在 5.1 下能不能载入」一次都没测到）。所以所有中文都搬进
        # probe_windows_ps51.ps1（那份带 BOM），并新增「事实 0：仓库每个 .ps1 必须带 BOM」。
        # **本步只对「探针自己有没有跑起来」下硬断言**（BOM + 语法面 + ISO 形状 + verdict 非空）；
        # 三种 stderr 形态的结论先如实报出来，要断言什么取决于它报回的答案。
        # 分工也说清楚：它验的是**宿主**（载入、解析、返回形状、异常语义），不是备份产物。整轮
        # 产品在 5.1 下真跑一遍由本 job 末尾的「Backup round on Windows PowerShell 5.1」负责——
        # 这一步不重复跑它，是为了让「宿主级事实」在 10 秒内收敛，红了先看清楚是解析器的问题
        # 还是产品链路的问题（10-02 之前这一发欠着的原话是「探针不跑产品，跑产品要 25 分钟」；
        # 实测同一 job 的 pwsh 产品轮只要几十秒，那个数是猜的，见 §4.24）。
        shell: powershell
        timeout-minutes: 10
        run: |
          & "$PWD\probe_windows_ps51.ps1"
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Windows PowerShell 5.1 host probe rc=$LASTEXITCODE - see the probe51-* lines above"
              exit 1
          }

